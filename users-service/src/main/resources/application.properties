spring.application.name=users

# Defaults target the users-db container published on localhost by `docker compose up`.
# In containers these are overridden with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/users
spring.datasource.username=users
spring.datasource.password=users

email-service.url=${EMAIL_SERVICE_URL:http://localhost:8081}
email-service.connect-timeout=2s
# Longer than the provider's slowest normal response (4s) so only a hung provider times out
email-service.read-timeout=10s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
