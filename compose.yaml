name: next-spring-enterprise

# Dev mode:        docker compose up -d                      (infrastructure only)
# Full-stack mode: docker compose --profile app up --build   (everything in containers)

services:
  # Database per service: each microservice owns its own Postgres instance
  users-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  users-service:
    profiles: [app]
    build: ./users-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users
      SPRING_DATASOURCE_USERNAME: users
      SPRING_DATASOURCE_PASSWORD: users
    ports:
      - "8080:8080"
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  admin-console:
    profiles: [app]
    build: ./admin-console
    environment:
      USERS_SERVICE_URL: http://users-service:8080
    ports:
      - "3000:3000"
    depends_on:
      users-service:
        condition: service_healthy

volumes:
  users-db-data:
